<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>每日打卡日曆</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      margin-top: 10px;
    }
    .day {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: center;
      cursor: pointer;
      border-radius: 8px;
    }
    .day:hover {
      background-color: #eee;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .color-picker, .goal-section {
      margin-bottom: 10px;
    }
    .goal-item {
      margin: 5px 0;
    }
    .goal-item input {
      margin-right: 10px;
    }
    .record-section {
      margin-top: 20px;
    }
    .record-section input, .record-section textarea {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .record-section button {
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="monthYear"></h1>
  </div>

  <div class="color-picker">
    <label>0% 顏色：<input type="color" id="color0" value="#ffffff"></label>
    <label>50% 顏色：<input type="color" id="color50" value="#ffcccc"></label>
    <label>80% 顏色：<input type="color" id="color80" value="#add8e6"></label>
    <label>100% 顏色：<input type="color" id="color100" value="#dda0dd"></label>
  </div>

  <div class="goal-section">
    <h3>每日目標</h3>
    <input type="text" id="newGoal" placeholder="輸入新目標">
    <button onclick="addDailyGoal()">新增</button>
    <div id="goalList"></div>
  </div>

  <div class="calendar" id="calendar"></div>

  <div class="record-section" id="recordSection" style="display: none;">
    <h3 id="selectedDateDisplay">選擇日期：</h3>
    <input type="file" id="recordImage" accept="image/*">
    <textarea id="recordText" placeholder="輸入文字記錄"></textarea>
    <button onclick="saveRecord()">儲存記錄</button>
  </div>

  <script>
    const calendar = document.getElementById('calendar');
    const monthYear = document.getElementById('monthYear');
    const goalList = document.getElementById('goalList');
    const recordSection = document.getElementById('recordSection');
    const recordText = document.getElementById('recordText');
    const recordImage = document.getElementById('recordImage');
    const selectedDateDisplay = document.getElementById('selectedDateDisplay');

    const now = new Date();
    const currentYear = now.getFullYear();
    const currentMonth = now.getMonth();

    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    const firstDay = new Date(currentYear, currentMonth, 1).getDay();

    const monthNames = ['一月', '二月', '三月', '四月', '五月', '六月',
                        '七月', '八月', '九月', '十月', '十一月', '十二月'];
    monthYear.textContent = `${monthNames[currentMonth]} ${currentYear}`;

    const dailyGoals = JSON.parse(localStorage.getItem('dailyGoals') || '[]');
    const goalHistory = JSON.parse(localStorage.getItem('goalHistory') || '{}');
    const recordHistory = JSON.parse(localStorage.getItem('recordHistory') || '{}');

    function renderGoals() {
      goalList.innerHTML = '';
      dailyGoals.forEach((goal, index) => {
        const div = document.createElement('div');
        div.className = 'goal-item';
        div.innerHTML = `<input type="checkbox" onchange="toggleGoal(${index})">${goal.text} <button onclick="deleteGoal(${index})">刪除</button>`;
        goalList.appendChild(div);
      });
    }

    function addDailyGoal() {
      const input = document.getElementById('newGoal');
      const text = input.value.trim();
      if (text) {
        dailyGoals.push({ text });
        localStorage.setItem('dailyGoals', JSON.stringify(dailyGoals));
        input.value = '';
        renderGoals();
        updateCalendarColors();
      }
    }

    function toggleGoal(index) {
      const key = `${currentYear}-${currentMonth + 1}-${now.getDate()}-${index}`;
      goalHistory[key] = !(goalHistory[key] || false);
      localStorage.setItem('goalHistory', JSON.stringify(goalHistory));
      renderGoals();
      updateCalendarColors();
    }

    function deleteGoal(index) {
      dailyGoals.splice(index, 1);
      localStorage.setItem('dailyGoals', JSON.stringify(dailyGoals));
      renderGoals();
      updateCalendarColors();
    }

    function getCompletionRateForDay(day) {
      const keyBase = `${currentYear}-${currentMonth + 1}-${day}`;
      let completed = 0;
      for (let i = 0; i < dailyGoals.length; i++) {
        const key = `${keyBase}-${i}`;
        if (goalHistory[key]) completed++;
      }
      return dailyGoals.length === 0 ? 0 : Math.round((completed / dailyGoals.length) * 100);
    }

    function getColorFromCompletion(pct) {
      const c0 = document.getElementById('color0').value;
      const c50 = document.getElementById('color50').value;
      const c80 = document.getElementById('color80').value;
      const c100 = document.getElementById('color100').value;

      if (pct >= 100) return c100;
      else if (pct >= 80) return c80;
      else if (pct >= 50) return c50;
      else return c0;
    }

    function updateCalendarColors() {
      const days = document.querySelectorAll('.calendar .day');
      days.forEach((div, index) => {
        const day = parseInt(div.textContent);
        const rate = getCompletionRateForDay(day);
        const color = getColorFromCompletion(rate);
        div.style.backgroundColor = color;
      });
    }

    function showRecordForDay(day) {
      const recordKey = `${currentYear}-${currentMonth + 1}-${day}`;
      const recordData = recordHistory[recordKey] || {};
      recordText.value = recordData.text || '';
      recordImage.value = recordData.image || '';
      selectedDateDisplay.textContent = `選擇日期：${currentMonth + 1}月 ${day}日`; // 顯示選擇的日期
      recordSection.style.display = 'block';
      recordSection.setAttribute('data-day', day);
    }

    function saveRecord() {
      const day = recordSection.getAttribute('data-day');
      const recordKey = `${currentYear}-${currentMonth + 1}-${day}`;
      const text = recordText.value;
      const image = recordImage.value;
      recordHistory[recordKey] = { text, image };
      localStorage.setItem('recordHistory', JSON.stringify(recordHistory));
      alert('記錄已儲存！');
    }

    for (let i = 0; i < firstDay; i++) {
      const emptyCell = document.createElement('div');
      calendar.appendChild(emptyCell);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const div = document.createElement('div');
      div.className = 'day';
      div.textContent = day;
      div.onclick = () => showRecordForDay(day);
      calendar.appendChild(div);
    }

    renderGoals();
    updateCalendarColors();
  </script>
</body>
</html>
